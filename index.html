<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Culata Jovái Arquitectos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html, body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* SPLIT LAYOUT */
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
        }

        .sidebar {
            width: clamp(280px, 25%, 380px);
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .carousel-container {
            width: calc(100vw - clamp(280px, 25%, 380px));
            height: 100vh;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            z-index: 1;
            /* Hide scrollbars */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari/Opera */
        }

        /* CAROUSEL SLIDES */
        .carousel-slide {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            scroll-snap-align: start;
            opacity: 1;
            z-index: 1;
        }

        .carousel-slide img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: default;
            z-index: 1;
        }

        /* SIDEBAR CONTENT */
        .logo-text {
            cursor: pointer;
            height: 35px;
            display: flex;
            align-items: center;
        }

        .logo-text img {
            height: 100%;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .logo-text:hover img {
            opacity: 0.7;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 30px;
        }

        .contact-info p {
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.6;
            text-transform: uppercase;
            font-weight: 400;
        }

        .contact-info strong {
            font-weight: 700;
            font-size: 14px;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--accent-color);
        }

        .desktop-logo {
            display: flex;
        }

        .mobile-header {
            display: none;
        }

        .contact-block {
            padding-bottom: 30%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .links-column {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .about-link a {
            display: block;
            padding-bottom: 30px;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .social-links-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .social-links-text a {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .social-links-text a:hover {
            opacity: 0.7;
        }

        .language-selector {
            display: flex;
            gap: 16px;
        }

        .lang-option {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-color);
            opacity: 0.5;
            text-decoration: none;
            text-transform: lowercase;
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-weight: 400;
        }

        .lang-option:hover, .lang-option.active {
            opacity: 1;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
                padding: 16px 24px 8px 24px;
                background: var(--bg-color, #FFFFFF);
                z-index: 10;
                order: 0;
            }

            .desktop-logo {
                display: none !important;
            }

            .main-layout {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                width: 100%;
                overflow: hidden;
            }

            .carousel-container {
                width: 100%;
                flex: 1;
                height: auto;
                order: 1; /* Carousel at the top */
                flex-shrink: 1;
            }

            .sidebar {
                width: 100%;
                height: 250px;
                max-height: 35vh;
                max-height: 35dvh;
                padding: 16px 24px;
                order: 2; /* Sidebar below */
                overflow-y: auto;
                justify-content: flex-start;
                gap: 30px;
                flex-shrink: 0;
            }

            .logo-text {
                height: 26px;
                margin-bottom: 0;
            }

            .contact-block {
                padding-bottom: 0;
                gap: 12px;
                margin-bottom: 0;
                flex-direction: row;
                justify-content: space-between;
            }

            .links-column {
                gap: 20px;
                align-items: flex-end;
                text-align: right;
            }

            .links-column .social-links-text {
                align-items: flex-end;
            }

            .about-link a {
                padding-bottom: 28px !important;
            }

            .contact-info {
                gap: 20px;
                padding-bottom: 0;
            }

            .contact-info p {
                font-size: 11px;
                letter-spacing: 1.5px;
                line-height: 1.4;
            }

            .contact-info strong {
                font-size: 12px;
            }

            .social-links-text {
                gap: 15px;
            }

            .social-links-text a {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            .sidebar-footer {
                gap: 10px;
                padding-top: 4px;
            }

            .language-selector {
                gap: 20px;
                padding-top: 25px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                padding: 14px 18px;
            }
            .contact-block {
                gap: 10px;
            }
            .contact-info {
                gap: 6px;
            }
            .contact-info p {
                font-size: 10px;
                line-height: 1.35;
            }
            .contact-info strong {
                font-size: 11px;
            }
            .logo-text {
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- HEADER MOBILE -->
        <div class="mobile-header">
            <div class="logo-text" onclick="window.location.href='index.html'">
                <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
            </div>
        </div>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-text desktop-logo" onclick="window.location.href='index.html'">
                <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
            </div>

            <div class="contact-block">
                <div class="contact-info">
                    <p><strong data-i18n="contact-address">Dirección</strong><br>Asunción, Paraguay</p>
                    <p><strong>Email</strong><br><a href="mailto:contacto@culatajovai.com">contacto@culatajovai.com</a></p>
                    <p><strong data-i18n="contact-phone">Teléfono</strong><br><a href="tel:+595999000000">+595 999 000 000</a></p>
                </div>
                <div class="links-column">
                    <div class="social-links-text about-link">
                        <a href="sobre.html" data-i18n="nav-sobre">Sobre</a>
                    </div>
                    <div class="social-links-text">
                        <a href="https://www.instagram.com/culatajovai.arq/" target="_blank" rel="noopener">Instagram</a>
                        <a href="https://www.facebook.com/grupoculatajovai" target="_blank" rel="noopener">Facebook</a>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">

                <div class="language-selector">
                    <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
                    <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
                    <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
                </div>
            </div>
        </aside>

        <!-- CAROUSEL -->
        <div class="carousel-container" id="carouselContainer">
            <!-- Slides se generarán dinámicamente -->
        </div>
    </div>

    <script>
        // Sistema de traducción
        const translations = {
            es: { 'contact-address': 'Dirección', 'contact-phone': 'Teléfono', 'nav-sobre': 'Sobre' },
            en: { 'contact-address': 'Address', 'contact-phone': 'Phone', 'nav-sobre': 'About' },
            de: { 'contact-address': 'Adresse', 'contact-phone': 'Telefon', 'nav-sobre': 'Über' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Obtener portadas de los proyectos de forma estática (sin backend)
        async function getCarouselImages() {
            return [
                { cover: 'images/carrusel/01-la-cuadrita-1.jpg', title: 'La Cuadrita' },
                { cover: 'images/carrusel/02-edificio-carpinelli.jpg', title: 'Edificio Carpinelli' },
                { cover: 'images/carrusel/03-vivienda-gt.jpg', title: 'Vivienda GT' },
                { cover: 'images/carrusel/04-vivienda-los-mangos.jpg', title: 'Vivienda Los Mangos' },
                { cover: 'images/carrusel/05-vivienda-los-mangos-2.jpg', title: 'Vivienda Los Mangos II' },
                { cover: 'images/carrusel/06-casa-ilona.jpg', title: 'Casa Ilona' },
                { cover: 'images/carrusel/07-petalo-de-estrellas.jpg', title: 'Pétalo de Estrellas' },
                { cover: 'images/carrusel/08-estudio-ciudad-nueva.jpg', title: 'Estudio Ciudad Nueva' },
                { cover: 'images/carrusel/09-la-cuadrita-2.jpg', title: 'La Cuadrita' },
                { cover: 'images/carrusel/10-casita-suburbana.jpg', title: 'Casita Suburbana' },
                { cover: 'images/carrusel/11-vivienda-aqua.jpg', title: 'Vivienda Aqua' },
                { cover: 'images/carrusel/12-reforma-casa-serbia.jpg', title: 'Reforma Casa Serbia' },
                { cover: 'images/carrusel/13-casa-para-un-malabarista.jpg', title: 'Casa para un malabarista' },
                { cover: 'images/carrusel/14-pai-nu.jpg', title: 'Pa´í Ñu' },
                { cover: 'images/carrusel/15-casa-miralago.jpg', title: 'Casa Miralago' },
                { cover: 'images/carrusel/16-leo-i.jpg', title: 'Leo I' },
                { cover: 'images/carrusel/17-obra-4g0a3836.jpg', title: 'Grupo Culata Jovái' },
                { cover: 'images/carrusel/18-obra-dsc01602.jpg', title: 'Grupo Culata Jovái' },
                { cover: 'images/carrusel/19-obra-57a6456.jpg', title: 'Grupo Culata Jovái' }
            ];
        }

        // Crear slides del carousel
        async function createCarousel() {
            const projects = await getCarouselImages();
            const container = document.getElementById('carouselContainer');

            if (projects.length === 0) {
                container.innerHTML = '<div class="loading">No hay proyectos disponibles</div>';
                return;
            }
            
            container.innerHTML = '';

            // Clonar último elemento al inicio y el primer elemento al final para efecto infinito
            const allProjects = [projects[projects.length - 1], ...projects, projects[0]];

            allProjects.forEach((project) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                
                if (project.cover) {
                    slide.innerHTML = `<img src="${project.cover}" alt="${project.title}">`;
                } else {
                    slide.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#999;letter-spacing:1px;text-transform:uppercase;">Sin portada</div>`;
                }
                
                container.appendChild(slide);
            });

            // Establecer posición inicial en el primer elemento real (saltando el clon)
            // Sin animación: si no, el scroll infinito interpreta el salto inicial como llegar al clon
            container.style.scrollBehavior = 'auto';
            container.scrollLeft = container.clientWidth;
            container.offsetHeight;
            container.style.scrollBehavior = 'smooth';
        }

        // Scroll infinito con clones
        const setupInfiniteScroll = () => {
            const container = document.getElementById('carouselContainer');
            if (!container) return;

            container.addEventListener('scroll', () => {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                // Si llegó al clon del final (derecha)
                if (container.scrollLeft >= maxScrollLeft - 5) {
                    container.style.scrollBehavior = 'auto';
                    container.scrollLeft = container.clientWidth;
                    // Forzar reflow antes de restaurar smooth
                    container.offsetHeight; 
                    container.style.scrollBehavior = 'smooth';
                }
                // Si llegó al clon del inicio (izquierda)
                else if (container.scrollLeft <= 5) {
                    container.style.scrollBehavior = 'auto';
                    container.scrollLeft = maxScrollLeft - container.clientWidth;
                    container.offsetHeight;
                    container.style.scrollBehavior = 'smooth';
                }
            });

            // Teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    container.scrollBy({ left: container.clientWidth, behavior: 'smooth' });
                }
                if (e.key === 'ArrowLeft') {
                    container.scrollBy({ left: -container.clientWidth, behavior: 'smooth' });
                }
            });
        };

        // Inicializar carousel
        createCarousel().then(() => {
            setupInfiniteScroll();
        });

        // Inicializar idioma
        initLanguage();
    </script>
</body>
</html>
