<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Culata Jovái Arquitectos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html, body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* SPLIT LAYOUT */
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
        }

        .sidebar {
            width: clamp(280px, 25%, 380px);
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .carousel-container {
            width: calc(100vw - clamp(280px, 25%, 380px));
            height: 100vh;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            z-index: 1;
            /* Hide scrollbars */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari/Opera */
        }

        /* CAROUSEL SLIDES */
        .carousel-slide {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            scroll-snap-align: start;
            opacity: 1;
            z-index: 1;
        }

        .carousel-slide img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: default;
            z-index: 1;
        }

        /* SIDEBAR CONTENT */
        .logo-text {
            cursor: pointer;
            height: 35px;
            display: flex;
            align-items: center;
        }

        .logo-text img {
            height: 100%;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .logo-text:hover img {
            opacity: 0.7;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 30px;
        }

        .contact-info p {
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.6;
            text-transform: uppercase;
            font-weight: 400;
        }

        .contact-info strong {
            font-weight: 700;
            font-size: 14px;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--accent-color);
        }

        .desktop-logo {
            display: flex;
        }

        .mobile-header {
            display: none;
        }

        .contact-block {
            padding-bottom: 30%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .links-column {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .about-link a {
            display: block;
            padding-bottom: 30px;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .social-links-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .social-links-text a {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .social-links-text a:hover {
            opacity: 0.7;
        }

        .language-selector {
            display: flex;
            gap: 16px;
        }

        .lang-option {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-color);
            opacity: 0.5;
            text-decoration: none;
            text-transform: lowercase;
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-weight: 400;
        }

        .lang-option:hover, .lang-option.active {
            opacity: 1;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
                padding: 16px 24px 8px 24px;
                background: var(--bg-color, #FFFFFF);
                z-index: 10;
                order: 0;
            }

            .desktop-logo {
                display: none !important;
            }

            .main-layout {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                width: 100%;
                overflow: hidden;
            }

            .carousel-container {
                width: 100%;
                flex: 1;
                height: auto;
                order: 1; /* Carousel at the top */
                flex-shrink: 1;
            }

            .sidebar {
                width: 100%;
                height: 250px;
                max-height: 35vh;
                max-height: 35dvh;
                padding: 16px 24px;
                order: 2; /* Sidebar below */
                overflow-y: auto;
                justify-content: flex-start;
                gap: 30px;
                flex-shrink: 0;
            }

            .logo-text {
                height: 26px;
                margin-bottom: 0;
            }

            .contact-block {
                padding-bottom: 0;
                gap: 12px;
                margin-bottom: 0;
                flex-direction: row;
                justify-content: space-between;
            }

            .links-column {
                gap: 20px;
                align-items: flex-end;
                text-align: right;
            }

            .links-column .social-links-text {
                align-items: flex-end;
            }

            .about-link a {
                padding-bottom: 28px !important;
            }

            .contact-info {
                gap: 20px;
                padding-bottom: 0;
            }

            .contact-info p {
                font-size: 11px;
                letter-spacing: 1.5px;
                line-height: 1.4;
            }

            .contact-info strong {
                font-size: 12px;
            }

            .social-links-text {
                gap: 15px;
            }

            .social-links-text a {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            .sidebar-footer {
                gap: 10px;
                padding-top: 4px;
            }

            .language-selector {
                gap: 20px;
                padding-top: 25px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                padding: 14px 18px;
            }
            .contact-block {
                gap: 10px;
            }
            .contact-info {
                gap: 6px;
            }
            .contact-info p {
                font-size: 10px;
                line-height: 1.35;
            }
            .contact-info strong {
                font-size: 11px;
            }
            .logo-text {
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- HEADER MOBILE -->
        <div class="mobile-header">
            <div class="logo-text" onclick="window.location.href='index.html'">
                <img class="cms-logo" src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
            </div>
        </div>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-text desktop-logo" onclick="window.location.href='index.html'">
                <img class="cms-logo" src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
            </div>

            <div class="contact-block">
                <div class="contact-info">
                    <p><strong data-i18n="contact-address">Dirección</strong><br><span id="cmsAddress">Asunción, Paraguay</span></p>
                    <p id="cmsEmailRow"><strong>Email</strong><br><a id="cmsEmail" href="mailto:contacto@culatajovai.com">contacto@culatajovai.com</a></p>
                    <p id="cmsPhoneRow"><strong data-i18n="contact-phone">Teléfono</strong><br><a id="cmsPhone" href="tel:+595999000000">+595 999 000 000</a></p>
                </div>
                <div class="links-column">
                    <div class="social-links-text about-link">
                        <a href="sobre.html" data-i18n="nav-sobre">Sobre</a>
                    </div>
                    <div class="social-links-text">
                        <a id="cmsInstagram" href="https://www.instagram.com/culatajovai.arq/" target="_blank" rel="noopener">Instagram</a>
                        <a id="cmsFacebook" href="https://www.facebook.com/grupoculatajovai" target="_blank" rel="noopener">Facebook</a>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">

                <div class="language-selector">
                    <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
                    <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
                    <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
                </div>
            </div>
        </aside>

        <!-- CAROUSEL -->
        <div class="carousel-container" id="carouselContainer">
            <!-- Slides se generarán dinámicamente -->
        </div>
    </div>

    <script src="cms.js"></script>
    <script>
        // Textos por defecto (se reemplazan por lo que se edite en /admin)
        const translations = {
            es: { 'contact-address': 'Dirección', 'contact-phone': 'Teléfono', 'nav-sobre': 'Sobre' },
            en: { 'contact-address': 'Address', 'contact-phone': 'Phone', 'nav-sobre': 'About' },
            de: { 'contact-address': 'Adresse', 'contact-phone': 'Telefon', 'nav-sobre': 'Über' }
        };

        // Fotos por defecto del carrusel (si el panel no tiene contenido guardado)
        const DEFAULT_CAROUSEL = [
            { src: 'images/carrusel/01-la-cuadrita-1.jpg', title: 'La Cuadrita' },
            { src: 'images/carrusel/02-edificio-carpinelli.jpg', title: 'Edificio Carpinelli' },
            { src: 'images/carrusel/03-vivienda-gt.jpg', title: 'Vivienda GT' },
            { src: 'images/carrusel/04-vivienda-los-mangos.jpg', title: 'Vivienda Los Mangos' },
            { src: 'images/carrusel/05-vivienda-los-mangos-2.jpg', title: 'Vivienda Los Mangos II' },
            { src: 'images/carrusel/06-casa-ilona.jpg', title: 'Casa Ilona' },
            { src: 'images/carrusel/07-petalo-de-estrellas.jpg', title: 'Pétalo de Estrellas' },
            { src: 'images/carrusel/08-estudio-ciudad-nueva.jpg', title: 'Estudio Ciudad Nueva' },
            { src: 'images/carrusel/09-la-cuadrita-2.jpg', title: 'La Cuadrita' },
            { src: 'images/carrusel/10-casita-suburbana.jpg', title: 'Casita Suburbana' },
            { src: 'images/carrusel/11-vivienda-aqua.jpg', title: 'Vivienda Aqua' },
            { src: 'images/carrusel/12-reforma-casa-serbia.jpg', title: 'Reforma Casa Serbia' },
            { src: 'images/carrusel/13-casa-para-un-malabarista.jpg', title: 'Casa para un malabarista' },
            { src: 'images/carrusel/14-pai-nu.jpg', title: 'Pa´í Ñu' },
            { src: 'images/carrusel/15-casa-miralago.jpg', title: 'Casa Miralago' },
            { src: 'images/carrusel/16-leo-i.jpg', title: 'Leo I' },
            { src: 'images/carrusel/17-obra-4g0a3836.jpg', title: 'Grupo Culata Jovái' },
            { src: 'images/carrusel/18-obra-dsc01602.jpg', title: 'Grupo Culata Jovái' },
            { src: 'images/carrusel/19-obra-57a6456.jpg', title: 'Grupo Culata Jovái' }
        ];

        let SITE = null;          // contenido publicado desde /admin
        let currentLang = CMS.savedLang();
        let renderedSrcs = '';
        let previewActive = false;   // dentro del panel, la vista previa manda sobre lo publicado
        let layoutUpdaters = [];
        window.addEventListener('resize', () => layoutUpdaters.forEach(fn => fn()));

        function changeLanguage(lang) {
            currentLang = lang;
            try { localStorage.setItem('selectedLanguage', lang); } catch (e) {}
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.toggle('active', option.dataset.lang === lang);
            });
        }

        function applyTranslations(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            if (SITE) applyContent(SITE, lang);
        }

        function setText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        function applyContent(c, lang) {
            const t = v => CMS.tr(v, lang);
            const h = c.home;
            document.querySelector('[data-i18n="contact-address"]').textContent = t(h.labels.address);
            document.querySelector('[data-i18n="contact-phone"]').textContent = t(h.labels.phone);
            document.querySelector('[data-i18n="nav-sobre"]').textContent = t(h.labels.about);
            setText('cmsAddress', t(h.address));

            const email = document.getElementById('cmsEmail');
            email.textContent = h.email;
            email.href = 'mailto:' + h.email;
            document.getElementById('cmsEmailRow').hidden = !h.email;

            const phone = document.getElementById('cmsPhone');
            phone.textContent = h.phone;
            phone.href = CMS.telHref(h.phone);
            document.getElementById('cmsPhoneRow').hidden = !h.phone;

            [['cmsInstagram', h.instagram], ['cmsFacebook', h.facebook]].forEach(([id, url]) => {
                const a = document.getElementById(id);
                a.href = url || '#';
                a.hidden = !url;
            });

            document.querySelectorAll('.cms-logo').forEach(img => {
                img.src = c.global.logo.src;
                img.alt = c.global.logo.alt;
            });
        }

        // Crear slides del carousel
        function createCarousel() {
            const projects = (SITE && SITE.home.carousel) || DEFAULT_CAROUSEL;
            const container = document.getElementById('carouselContainer');
            // Clonar último elemento al inicio y el primer elemento al final para efecto infinito
            const allProjects = projects.length ? [projects[projects.length - 1], ...projects, projects[0]] : [];

            // Si las fotos son las mismas, solo se actualiza disposición/encuadre (sin recargar)
            const srcs = JSON.stringify(allProjects.map(p => p.src));
            if (srcs === renderedSrcs) {
                const imgs = container.querySelectorAll('.carousel-slide img');
                layoutUpdaters = [];
                allProjects.forEach((project, i) => {
                    if (!imgs[i]) return;
                    imgs[i].alt = project.title || '';
                    layoutUpdaters.push(CMS.layoutImage(imgs[i], project));
                });
                return;
            }
            renderedSrcs = srcs;

            container.innerHTML = '';
            layoutUpdaters = [];
            if (!projects.length) return;

            allProjects.forEach((project, i) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                const img = document.createElement('img');
                img.src = project.src;
                img.alt = project.title || '';
                img.decoding = 'async';
                slide.style.overflow = 'hidden';
                if (i === 1) img.fetchPriority = 'high';
                else if (i > 2 && i < allProjects.length - 1) img.loading = 'lazy';
                slide.appendChild(img);
                container.appendChild(slide);
                // Disposición (Llenar / Completar / Completar vertical / horizontal), encuadre y zoom
                layoutUpdaters.push(CMS.layoutImage(img, project));
            });

            // Establecer posición inicial en el primer elemento real (saltando el clon)
            // Sin animación: si no, el scroll infinito interpreta el salto inicial como llegar al clon
            container.style.scrollBehavior = 'auto';
            container.scrollLeft = container.clientWidth;
            container.offsetHeight;
            container.style.scrollBehavior = 'smooth';
        }

        // Mostrar una foto concreta (la usa la vista previa del panel)
        function showSlide(index) {
            const container = document.getElementById('carouselContainer');
            container.style.scrollBehavior = 'auto';
            container.scrollLeft = container.clientWidth * (index + 1);
            container.offsetHeight;
            container.style.scrollBehavior = 'smooth';
        }

        // Scroll infinito con clones
        const setupInfiniteScroll = () => {
            const container = document.getElementById('carouselContainer');
            if (!container) return;

            container.addEventListener('scroll', () => {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                // Si llegó al clon del final (derecha)
                if (container.scrollLeft >= maxScrollLeft - 5) {
                    container.style.scrollBehavior = 'auto';
                    container.scrollLeft = container.clientWidth;
                    // Forzar reflow antes de restaurar smooth
                    container.offsetHeight;
                    container.style.scrollBehavior = 'smooth';
                }
                // Si llegó al clon del inicio (izquierda)
                else if (container.scrollLeft <= 5) {
                    container.style.scrollBehavior = 'auto';
                    container.scrollLeft = maxScrollLeft - container.clientWidth;
                    container.offsetHeight;
                    container.style.scrollBehavior = 'smooth';
                }
            });

            // Teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    container.scrollBy({ left: container.clientWidth, behavior: 'smooth' });
                }
                if (e.key === 'ArrowLeft') {
                    container.scrollBy({ left: -container.clientWidth, behavior: 'smooth' });
                }
            });
        };

        // Inicializar
        updateLanguageUI(currentLang);
        applyTranslations(currentLang);
        setupInfiniteScroll();

        CMS.load().then(content => {
            if (previewActive) return;
            if (content) {
                SITE = content;
                applyTranslations(currentLang);
            }
            createCarousel();
        });

        // Vista previa en vivo desde /admin
        CMS.onPreview((content, lang, focus) => {
            previewActive = true;
            SITE = content;
            if (lang && lang !== currentLang) changeLanguage(lang);
            else applyTranslations(currentLang);
            createCarousel();
            if (typeof focus === 'number') showSlide(focus);
        });
    </script>
</body>
</html>
